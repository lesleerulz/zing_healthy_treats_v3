name: Keep Supabase Alive

on:
  schedule:
    # Runs at 12:00 PM UTC every day
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows running manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth Health
        run: curl -s https://tetcosmsdmhlihasvext.supabase.co/auth/v1/health
      - name: Ping Supabase REST API
        run: curl -s https://tetcosmsdmhlihasvext.supabase.co/rest/v1/
